<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just For Fun</title>
</head>
<body>
    <canvas id="gameArea" width="400" height="400"></canvas>
</body>
<script type="module">
    import Vector2 from './vector.js';
    import Ship from './ship.js';
    import Game from './game.js';
    const game = new Game();
    const ship = new Ship(new Vector2(200, 200), new Vector2(0, 0));
    game.addGameObject(ship);

    const context = document.getElementById('gameArea').getContext('2d');
    function gameLoop() {
        game.update();
        context.clearRect(0, 0, 400, 400);
        game.render(context);
        requestAnimationFrame(gameLoop);
    }
    gameLoop();
</script>

</html>
