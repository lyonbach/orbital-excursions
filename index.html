<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orbital Excursions</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="approach-warnings.css">
</head>
<body>
<div id="wrap">
<canvas id="game"></canvas>
<div id="hud" class="hidden">
  <div class="panel">
    <div>TIME <span id="time">0.0</span> s</div>
    <div>ALTITUDE <span id="alt">0</span> m</div>
    <div>GEAR <span id="gearStatus" class="warn">UP</span> <span class="small">[G]</span></div>
    <div>FUEL <span id="fuelText"></span></div><div class="bar"><div id="fuelFill" class="fill" style="width:100%"></div></div>
    <div>HULL</div><div class="bar"><div id="hullFill" class="fill" style="width:100%"></div></div>
    <div>PASSENGER HEALTH</div><div class="bar"><div id="crewFill" class="fill" style="width:100%"></div></div>
    <div>PASSENGER HAPPINESS</div><div class="bar"><div id="happyFill" class="fill" style="width:100%"></div></div>
  </div>
</div>
<div id="env" class="hidden"></div>
<div id="approachAlerts" class="approach-alert hidden" role="status" aria-live="polite"></div>
<div id="screen"><div id="screenCard" class="card"></div></div>
</div>
<script src="fuel-economy.js?v=20261101-economy-fix"></script>
<script src="thrusters.js?v=20261101-economy-fix"></script>
<script src="approach-warnings.js?v=20261101-economy-fix"></script>
<script src="moving-platform.js?v=platform-module-1"></script>
<script src="game.js?v=20261101-economy-fix"></script>
<script src="environment-visuals.js?v=jupiter-steampunk-2"></script>
<script src="landing-visuals.js?v=flight-shake-2"></script>
<script src="pad-lights.js?v=orange-pad-1"></script>
<script src="level-design.js?v=lunar-campaign-1"></script>
</body>
</html>
