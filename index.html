<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Just For Fun</title>
</head>
<body>
    <canvas id="gameArea" width="1024" height="1024"></canvas>
</body>
<script type="module">
    import Vector2 from './vector.js';
    import { ShipTypeA } from './ship.js';
    import Game from './game.js';
    import { Earth } from './environment.js';
    import { Platform } from './gameObject.js';

    
    const canvas = document.getElementById('gameArea');
    const context = canvas.getContext('2d');
    
    const width = canvas.width;
    const height = canvas.height;
    
    canvas.setAttribute("tabindex", "0"); // make canvas focusable
    canvas.focus(); // set focus to the canvas so it can receive keyboard events

    canvas.addEventListener("keydown", (e) => {
        if (e.code === "KeyA") {
            e.preventDefault();
            // playerShip.thrust = -playerShip.thrustCapability;
        } else if (e.code === "KeyD") {
            e.preventDefault();
            // playerShip.thrust = playerShip.thrustCapability;
        } else if (e.code === "KeyW") {
            e.preventDefault();
            playerShip.thrust = playerShip.thrustCapability;
        } else if (e.code === "KeyS") {
            e.preventDefault();
            playerShip.thrust = -playerShip.thrustCapability;
        } else if (e.code === "KeyQ") {
            e.preventDefault();
            playerShip.angularAcceleration = -playerShip.angularThrustCapability;
        } else if (e.code === "KeyE") {
            e.preventDefault();
            playerShip.angularAcceleration =  playerShip.angularThrustCapability;
        }
    });


    canvas.addEventListener("keyup", (e) => {
        if (["KeyA", "KeyD", "KeyW", "KeyS"].includes(e.code)) {
            e.preventDefault();
            playerShip.thrust = 0;
        }
        if (["KeyQ", "KeyE"].includes(e.code)) {
            e.preventDefault();
            playerShip.angularAcceleration = 0;
        }
    });


    const game = new Game(new Earth());
    const startPos = new Vector2(width/2, height/4);
    const playerShip = new ShipTypeA(startPos, new Vector2(0, 0));
    game.addGameObject(playerShip);

    const platform = new Platform(new Vector2(width/4, height/2), width/2, 20);
    game.addGameObject(platform);

    function gameLoop() {

        game.update();
        context.clearRect(0, 0, width, height);

        context.fillStyle = "black";
        context.fillRect(0, 0, width, height);

        game.update();
        game.render(context);

        requestAnimationFrame(gameLoop);
    }
    gameLoop();





</script>

</html>
