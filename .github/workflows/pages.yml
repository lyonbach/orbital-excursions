name: Deploy to GitHub Pages
on:
  push:
    branches:
      - suspension

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Dependencies
        run: npm clean-install

      - name: Build
        run: npm run build

      - name: Prepare
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r dist _site/
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy Site
        id: deployment
        uses: actions/deploy-pages@v5
